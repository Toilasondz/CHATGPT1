# 1. Khai báo Theos
export THEOS="$HOME/theos"

# 2. Vào thư mục project
cd "$GITHUB_WORKSPACE"

# 3. Kiểm tra SDK và Theos
test -f "$THEOS/makefiles/common.mk" || exit 1
ls "$THEOS/sdks"

# 4. Kiểm tra mapping 4 chức năng
python3 scripts/verify-feature-map.py

# 5. Build
make clean
make package FINALPACKAGE=1
